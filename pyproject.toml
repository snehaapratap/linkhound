[project]
name = "linkhound"
version = "0.1.0"
description = "A command-line tool that sniffs out broken links on web pages."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ivan Posavec", email = "342222514+ivnpsvc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
linkhound = "linkhound.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.0",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov=linkhound", "--cov-report=term-missing"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern syntax,
# SIM: simplifications, PT: pytest style
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]
